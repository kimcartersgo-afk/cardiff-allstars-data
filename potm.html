<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardiff Allstars FC - Player of the Month Vote</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', sans-serif;
      background: #0d0d0d;
      color: #fff;
      /* Subtle dark striped background simulating a pitch */
      background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255, 255, 255, 0.02) 40px, rgba(255, 255, 255, 0.02) 80px);
    }

    .widget {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .header {
      margin-bottom: 2rem;
      text-align: center;
      position: relative;
    }
    
    .header::after {
      content: '⭐ ⭐ ⭐';
      display: block;
      color: #cf6f1c;
      font-size: 1.2rem;
      margin-top: 0.5rem;
      letter-spacing: 0.5rem;
    }

    .club-badge {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin: 0 auto 1rem auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
    }

    .header-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cf6f1c;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    /* Voting Form */
    .vote-form {
      background: rgba(26, 26, 26, 0.95);
      border: 2px solid #cf6f1c;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .player-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .player-option {
      position: relative;
    }

    .player-option input[type="radio"] {
      display: none;
    }

    /* Sporty Player Cards */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      background: linear-gradient(135deg, #222 0%, #111 100%);
      border: 2px solid #333;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    
    .player-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: #cf6f1c;
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    .player-card:hover {
      border-color: #555;
      transform: translateY(-2px);
    }

    .player-option input[type="radio"]:checked + .player-card {
      border-color: #cf6f1c;
      background: linear-gradient(135deg, rgba(207, 111, 28, 0.15) 0%, #111 100%);
      box-shadow: 0 4px 15px rgba(207, 111, 28, 0.2);
    }
    
    .player-option input[type="radio"]:checked + .player-card::before {
      transform: scaleX(1);
    }
    
    .player-option input[type="radio"]:checked + .player-card .player-name {
      color: #cf6f1c;
    }

    .player-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #cf6f1c;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      overflow: hidden;
      border: 3px solid #111;
      box-shadow: 0 0 0 2px #cf6f1c;
    }
    
    .player-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
      text-align: center;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .player-pos {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .form-control {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #111;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #cf6f1c;
      background: #1a1a1a;
    }

    .btn-submit {
      width: 100%;
      padding: 1.2rem;
      background: #cf6f1c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      font-style: italic;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background: #b15d16;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(207, 111, 28, 0.4);
    }

    .success-msg {
      display: none;
      background: rgba(76, 175, 80, 0.1);
      border: 2px solid #4caf50;
      color: #4caf50;
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-msg {
      display: none;
      background: rgba(207, 111, 28, 0.1);
      border: 2px solid #cf6f1c;
      color: #cf6f1c;
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="widget">

  <div class="header">
    <img src="https://cardiffallstarsfc.com/wp-content/uploads/go-x/u/05dd8123-06b9-43b8-ba93-02586a6650ec/image.png" alt="Cardiff Allstars FC Badge" class="club-badge">
    <div class="header-title">Cardiff Allstars September Player Of The Month</div>
  </div>

  <!-- Replace the action URL with your form handler (e.g. Formspree, Netlify forms, or your backend) -->
  <form id="potm-form" class="vote-form" action="https://formspree.io/f/mrpbjkba" method="POST">
    
    <div class="form-group">
      <label>🏆 Select your Player of the Month:</label>
      <div class="player-list">
        
        <!-- Isla Rose -->
        <label class="player-option">
          <input type="radio" name="player" value="Isla Rose (Under 9s)" required>
          <div class="player-card">
            <div class="player-avatar"><img src="images/potm/2026-10/isla_rose.jpg" alt="Isla Rose"></div>
            <div class="player-name">Isla Rose</div>
            <div class="player-pos">Under 9's</div>
          </div>
        </label>

        <!-- Jayden Martin -->
        <label class="player-option">
          <input type="radio" name="player" value="Jayden Martin (Under 12s)">
          <div class="player-card">
            <div class="player-avatar"><img src="images/potm/2026-10/jayden_martin.jpg" alt="Jayden Martin"></div>
            <div class="player-name">Jayden Martin</div>
            <div class="player-pos">Under 12's</div>
          </div>
        </label>

        <!-- Oliver Elliott -->
        <label class="player-option">
          <input type="radio" name="player" value="Oliver Elliott (Under 16s)">
          <div class="player-card">
            <div class="player-avatar"><img src="images/potm/2026-10/oliver_elliott.jpg" alt="Oliver Elliott"></div>
            <div class="player-name">Oliver Elliott</div>
            <div class="player-pos">Under 16's</div>
          </div>
        </label>

        <!-- Lathem Miller -->
        <label class="player-option">
          <input type="radio" name="player" value="Lathem Miller (First Team)">
          <div class="player-card">
            <div class="player-avatar"><img src="images/potm/2026-10/lathem_miller.jpg" alt="Lathem Miller"></div>
            <div class="player-name">Lathem Miller</div>
            <div class="player-pos">First Team</div>
          </div>
        </label>

        <!-- Korey Lynch -->
        <label class="player-option">
          <input type="radio" name="player" value="Korey Lynch (Reserves)">
          <div class="player-card">
            <div class="player-avatar"><img src="images/potm/2026-10/korey_lynch.jpg" alt="Korey Lynch"></div>
            <div class="player-name">Korey Lynch</div>
            <div class="player-pos">Reserves</div>
          </div>
        </label>

      </div>
    </div>

    <div class="form-group">
      <label for="voter-name">Your Name (Optional)</label>
      <input type="text" id="voter-name" name="voter_name" class="form-control" placeholder="Enter your name">
    </div>

    <button type="submit" class="btn-submit">Submit Vote</button>
  </form>

  <div id="success-msg" class="success-msg">
    Thank you! Your vote has been recorded.
  </div>

  <div id="status-msg" class="status-msg"></div>

</div>

<script>
  const form = document.getElementById('potm-form');
  const successMsg = document.getElementById('success-msg');
  const statusMsg = document.getElementById('status-msg');
  const submitBtn = form.querySelector('.btn-submit');
  const HAS_VOTED_KEY = 'cardiff_allstars_potm_voted_october_2026';

  // Check timing (Opens 7th at 00:01, Closes 15th at 23:59)
  const now = new Date();
  const date = now.getDate();
  const hours = now.getHours();
  const minutes = now.getMinutes();
  
  const isBeforeOpen = (date < 7) || (date === 7 && hours === 0 && minutes === 0);
  const isAfterClose = (date > 15);

  if (isBeforeOpen) {
    form.style.display = 'none';
    statusMsg.textContent = 'The Vote for this month has not opened yet. Please come back again on the 7th.';
    statusMsg.style.display = 'block';
  } else if (isAfterClose) {
    form.style.display = 'none';
    statusMsg.textContent = 'Voting for this month has closed. Results will be announced shortly.';
    statusMsg.style.display = 'block';
  } else if (localStorage.getItem(HAS_VOTED_KEY)) {
    // Check if they already voted
    form.style.display = 'none';
    statusMsg.textContent = 'You have already voted this month!';
    statusMsg.style.display = 'block';
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault(); 
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    const data = new FormData(form);
    
    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => {
      if (response.ok) {
        localStorage.setItem(HAS_VOTED_KEY, 'true');
        form.style.display = 'none';
        successMsg.textContent = 'Thank you! Your vote has been recorded.';
        successMsg.style.display = 'block';
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Vote';
        alert("Oops! There was a problem submitting your vote.");
      }
    })
    .catch(error => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Vote';
      alert("Oops! There was a problem submitting your vote.");
    });
  });
</script>
</body>
</html>
