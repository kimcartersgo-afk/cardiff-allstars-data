name: Scrape FAW Comet Match Data

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes for live score updates
  workflow_dispatch:          # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  scrape-matches:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Run match scraper
        continue-on-error: true
        env:
          COMET_SESSION: ${{ secrets.COMET_SESSION }}
        run: python scraper/scrape_matches.py

      - name: Commit updated match data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore: update match data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
